services:
  - type: web
    name: creatorlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      # The embedding model doesn't fit in the free 512 MB server, so the visitor's browser
      # computes the query embedding (transformers.js) and sends it with each search.
      - key: SERVER_EMBEDDINGS
        value: "0"
