services:
  - type: web
    name: creatorlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN          # query embeddings come from Hugging Face; the model doesn't fit in 512 MB
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
